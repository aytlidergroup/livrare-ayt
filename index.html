<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/jpeg" href="images.jpg">
<link rel="apple-touch-icon" href="images.jpg">
<title>AYT Livrare</title>
<style>
  :root {
    --bg-base: #0a0f1c;
    --bg-card: rgba(30, 41, 59, 0.6);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #d4af37;
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.15);
    --delivered: #38bdf8;
    --delivered-bg: rgba(56, 189, 248, 0.16);
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.15);
    --border-radius: 20px;
    --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; font-family: var(--font-family);
    background-color: var(--bg-base); color: var(--text-main);
    min-height: 100vh; padding-top: env(safe-area-inset-top);
    padding-bottom: calc(50px + env(safe-area-inset-bottom));
    background-image:
      radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
    background-attachment: fixed; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; position: sticky; top: 0; z-index: 50;
    background: rgba(10, 15, 28, 0.7);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    gap: 8px;
  }

  .icon-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main); width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    text-decoration: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .header-center { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; overflow: hidden; }
  .header-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #000; border: 1px solid rgba(212, 175, 55, 0.3); }
  .header-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
  .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .header-actions .icon-btn { width: 40px; height: 40px; border-radius: 12px; }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }

  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; left: -320px; width: 310px; height: 100vh;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    z-index: 100; border-right: 1px solid rgba(255,255,255,0.1);
    transition: left 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
  }
  .drawer.open { left: 0; }

  .drawer-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
  .drawer-logo { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #000; border: 2px solid var(--accent); }
  .drawer-title { font-size: 18px; font-weight: 700; color: var(--text-main); flex: 1; }

  .drawer-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }

  .driver-item {
    background: rgba(255,255,255,0.03); border-radius: 14px; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
  }
  .driver-item.active { border-color: rgba(212, 175, 55, 0.3); background: rgba(212, 175, 55, 0.1); }
  .driver-name { font-size: 15px; font-weight: 600; color: var(--text-main); }
  .driver-badge { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .driver-item.active .driver-badge { background: var(--accent); color: #000; }

  .container { padding: 16px; max-width: 700px; margin: 0 auto; position: relative; }

  .store {
    background: var(--bg-card);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: var(--border-radius); margin-bottom: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, opacity 0.18s ease;
    position: relative;
  }

  .store.dragging {
    opacity: 0.92;
    transform: scale(1.03);
    border-color: var(--accent);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(212, 175, 55, 0.35);
    z-index: 40;
    background: rgba(30, 41, 59, 0.95);
  }

  .store.drag-over-top {
    border-top: 3px solid var(--accent);
  }

  .store-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

  .drag-handle {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 42px; border-radius: 10px;
    color: var(--text-muted); cursor: grab; flex-shrink: 0;
    touch-action: none; user-select: none; -webkit-user-select: none;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    transition: color 0.15s, background 0.15s;
  }
  .drag-handle:active, .store.dragging .drag-handle {
    cursor: grabbing;
    color: var(--accent);
    background: rgba(212, 175, 55, 0.14);
    border-color: rgba(212, 175, 55, 0.35);
  }
  .drag-handle svg { width: 18px; height: 18px; fill: currentColor; }

  .store-info { flex: 1; min-width: 0; cursor: pointer; }
  .store-name-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .store-index { font-size: 12px; font-weight: 700; color: var(--accent); background: rgba(212, 175, 55, 0.12); padding: 2px 7px; border-radius: 6px; flex-shrink: 0; margin-top: 2px; }
  .store-name {
    font-size: 16px; font-weight: 600; letter-spacing: -0.2px; line-height: 1.35;
    flex: 1; min-width: 0;
    white-space: normal; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .store.open .store-name { display: block; -webkit-line-clamp: unset; overflow: visible; }

  .btn-location {
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(212, 175, 55, 0.1); color: var(--accent);
    width: 30px; height: 30px; border-radius: 8px; text-decoration: none;
    border: 1px solid rgba(212, 175, 55, 0.2); transition: all 0.2s;
    flex-shrink: 0; cursor: pointer;
  }
  .btn-location svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .btn-location:active { background: rgba(212, 175, 55, 0.3); transform: scale(0.95); }

  .btn-location.disabled {
    background: rgba(255, 255, 255, 0.03); color: var(--text-muted);
    border-color: rgba(255, 255, 255, 0.05); cursor: not-allowed; opacity: 0.4;
  }

  .status-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .status-badge.done { background: var(--success-bg); color: var(--success); }
  .status-badge.wait { background: var(--warning-bg); color: var(--warning); }
  .status-badge.delivered-tag { background: var(--delivered-bg); color: var(--delivered); }

  .btn-deliver {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 9px;
    border: 1px solid rgba(56, 189, 248, 0.35);
    background: rgba(56, 189, 248, 0.12);
    color: var(--delivered);
    font-size: 12px; font-weight: 700; cursor: pointer;
    transition: all 0.18s ease;
  }
  .btn-deliver:active { transform: scale(0.94); }
  .btn-deliver.is-delivered {
    background: rgba(16, 185, 129, 0.18);
    border-color: rgba(16, 185, 129, 0.45);
    color: var(--success);
  }
  .btn-deliver:disabled { opacity: 0.6; cursor: wait; }

  .icon-arrow {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer;
  }
  .icon-arrow svg { width: 18px; height: 18px; stroke: var(--text-muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .store.open .icon-arrow { transform: rotate(180deg); background: rgba(255,255,255,0.1); }
  .store.open .icon-arrow svg { stroke: var(--text-main); }

  .store-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.32, 0.72, 0, 1); background: rgba(0,0,0,0.15); }
  .store.open .store-body { grid-template-rows: 1fr; }
  .store-body-inner { overflow: hidden; padding: 0 20px; opacity: 0; transition: opacity 0.3s ease, padding 0.3s ease; }
  .store.open .store-body-inner { padding: 16px 20px; opacity: 1; }

  .product { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.02); }
  .product:last-child { margin-bottom: 0; }
  .pname { font-size: 14px; color: var(--text-muted); font-weight: 500; flex: 1; padding-right: 12px; word-break: break-word; white-space: pre-line; }
  .pval { font-size: 15px; font-weight: 700; color: var(--accent); background: rgba(212, 175, 55, 0.1); padding: 4px 12px; border-radius: 8px; white-space: pre-line; text-align: right; }

  .customer-info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 50%; border: 1px solid rgba(212,175,55,0.45);
    background: rgba(212,175,55,0.14); color: var(--accent);
    font-size: 17px; font-weight: 800; cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .customer-info-btn:active { transform: scale(0.92); background: rgba(212,175,55,0.28); }
  .store.details-open .customer-info-btn {
    background: var(--accent); color: #0a0f1c;
  }

  .customer-detail {
    display: none; margin: 0 16px 14px 60px; padding: 12px 14px;
    border-radius: 12px; background: rgba(212,175,55,0.09);
    border: 1px solid rgba(212,175,55,0.22);
    color: var(--text-main); font-size: 13px; line-height: 1.65;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .store.details-open .customer-detail { display: block; }
  .customer-detail-title {
    color: var(--accent); font-weight: 700; margin-bottom: 6px;
  }
  .customer-detail-img {
    width: 100%; max-height: 240px; object-fit: cover;
    border-radius: 10px; margin-top: 8px; display: block;
    border: 1px solid rgba(255,255,255,0.14); cursor: zoom-in;
  }
  .customer-detail-text + .customer-detail-img { margin-top: 10px; }

  #photoViewer {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(5, 10, 20, 0.92); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #photoViewer.open { display: flex; }
  #photoViewer img {
    max-width: 100%; max-height: 88dvh; border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65);
  }
  #photoViewer .pv-close {
    position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.16); border: none; color: #fff;
    font-size: 20px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 20px; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 20px; border-radius: var(--border-radius); text-align: center; font-weight: 500; margin: 20px 0; }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(212, 175, 55, 0.4);
    color: var(--text-main); padding: 10px 20px; border-radius: 30px;
    font-size: 13px; font-weight: 600; z-index: 300;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 200; display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }

  .modal-content {
    background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    width: 100%; max-width: 500px; border-radius: 24px 24px 0 0;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .modal-overlay.open .modal-content { transform: translateY(0); }
  .modal-title { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 20px; color: var(--text-main); }

  .map-option {
    display: flex; align-items: center; gap: 16px; padding: 16px;
    background: rgba(255,255,255,0.05); border-radius: 16px; margin-bottom: 12px;
    cursor: pointer; text-decoration: none; color: var(--text-main);
    transition: background 0.2s;
  }
  .map-option:active { background: rgba(255,255,255,0.1); }
  .map-option-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .map-option-icon svg { width: 24px; height: 24px; }
  .map-option-text { font-size: 16px; font-weight: 600; }

  .btn-cancel {
    width: 100%; padding: 16px; background: rgba(255,255,255,0.1); border: none;
    border-radius: 16px; color: var(--text-main); font-size: 16px; font-weight: 600;
    margin-top: 8px; cursor: pointer;
  }
  .btn-cancel:active { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
<header class="header">
  <button class="icon-btn" onclick="toggleDrawer()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>

  <div class="header-center">
    <img src="images.jpg" alt="AYT Logo" class="header-logo">
    <div class="header-title" id="headerTitle">Se încarcă...</div>
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="refreshBtn" onclick="refreshData()" title="Reîmprospătare">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    </button>
    <a href="#" id="headerLocationBtn" target="_blank" class="icon-btn" title="Deschide link">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
    </a>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <img src="images.jpg" alt="AYT Logo" class="drawer-logo">
    <div class="drawer-title">Selectează Cursa</div>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div style="color: var(--text-muted); font-size: 14px; font-weight: 500;">Se încarcă datele...</div>
  </div>
</div>

<div class="toast" id="toast">Se salvează ordinea...</div>

<div id="photoViewer" onclick="this.classList.remove('open')">
  <button class="pv-close" type="button" aria-label="Închide">✕</button>
  <img id="pvImg" alt="Poză locație">
</div>

<div class="modal-overlay" id="mapModal" onclick="closeMapModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-title">Deschide locația cu...</div>

    <a href="#" id="btnAppleMaps" class="map-option" target="_blank">
      <div class="map-option-icon" style="background: linear-gradient(135deg, #34C759, #28a745);">
        <svg viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      </div>
      <div class="map-option-text">Apple Maps</div>
    </a>

    <a href="#" id="btnGoogleMaps" class="map-option" target="_blank">
      <div class="map-option-icon" style="background: white;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3" fill="#4285F4"></circle></svg>
      </div>
      <div class="map-option-text">Google Maps</div>
    </a>

    <a href="#" id="btnWaze" class="map-option" target="_blank">
      <div class="map-option-icon" style="background: #33ccff;">
        <svg viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      </div>
      <div class="map-option-text">Waze</div>
    </a>

    <button class="btn-cancel" onclick="closeMapModal()">Anulează</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbw1scAQgfp-AZ8ExrB2T_OHovF7ncvqgEzCQncCJMiYe1a-keLZ33NSYNhqmFG2T5GWpA/exec";
const HEADER_LOCATION_URL = "https://aytlidergroup.github.io/Ayt-Locatie/";

document.getElementById("headerLocationBtn").href = HEADER_LOCATION_URL;

let courses = [];
let allLocations = {};
let activeTab = 0;
let saveTimeout = null;
let savingDelivered = new Set();

let dragState = {
  active: false,
  sourceIndex: null,
  currentIndex: null,
  sourceEl: null
};

function normName(v) {
  return String(v || "")
    .replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
}

function isDelivered(cu) {
  const val = String(cu?.deliveredStatus || "").trim().toLowerCase();
  return val === "livrat" || val === "predat" || val === "da" || val === "true";
}

async function toggleDelivered(e, customerIndex) {
  e.preventDefault();
  e.stopPropagation();
  if (dragState.active) return;

  const course = courses[activeTab];
  const cu = course?.customers?.[customerIndex];
  if (!course || !cu) return;

  const opKey = normName(course.name) + "::" + normName(cu.name);
  if (savingDelivered.has(opKey)) return;

  const prevVal = cu.deliveredStatus || "";
  const nextDelivered = !isDelivered(cu);
  cu.deliveredStatus = nextDelivered ? "Livrat" : "";
  savingDelivered.add(opKey);
  render();

  showToast("⏳ Se actualizează coloana AB...", 0);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "markDelivered",
        courseName: course.name,
        customerName: cu.name,
        delivered: nextDelivered
      })
    });

    const result = await response.json();
    if (result.status === "success") {
      cu.deliveredStatus = result.value || "";
      render();
      showToast(nextDelivered ? "✅ Salvate în AB: Livrat" : "✅ Șters din AB", 2200);
    } else {
      cu.deliveredStatus = prevVal;
      render();
      showToast("⚠️ Eroare AB: " + (result.message || ""), 3500);
    }
  } catch (err) {
    cu.deliveredStatus = prevVal;
    render();
    showToast("❌ Eroare de rețea la salvare!", 3500);
  } finally {
    savingDelivered.delete(opKey);
  }
}

function getLocationDetails(cu) {
  if (!cu) return "";
  const loc = cu.location || allLocations[normName(cu.name)] || {};
  return String(loc.colI || loc.detali || cu.detali || "").trim();
}

function getLocationPhoto(cu) {
  if (!cu) return "";
  const loc = cu.location || allLocations[normName(cu.name)] || {};
  return String(loc.colJ || loc.photo || cu.photo || "").trim();
}

function openPhotoViewer(e, src) {
  e.preventDefault();
  e.stopPropagation();
  if (!src) return;
  document.getElementById("pvImg").src = src;
  document.getElementById("photoViewer").classList.add("open");
}

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    courses = data.courses || [];
    allLocations = data.allLocations || {};
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="error">Eroare de conexiune.<br>Vă rugăm verificați internetul.</div>`;
  }
}

async function refreshData() {
  if (dragState.active) return;
  const btn = document.getElementById("refreshBtn");
  if (btn.classList.contains("spinning")) return;
  btn.classList.add("spinning");
  try {
    const res = await fetch(API_URL + "?t=" + Date.now(), { cache: "no-store" });
    const data = await res.json();
    courses = data.courses || [];
    allLocations = data.allLocations || {};
    if (activeTab >= courses.length) activeTab = 0;
    render();
    showToast("✅ Date actualizate", 1800);
  } catch (e) {
    showToast("❌ Eroare de conexiune", 3000);
  } finally {
    btn.classList.remove("spinning");
  }
}

function showToast(msg, duration = 2000) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  if (duration > 0) {
    setTimeout(() => toast.classList.remove("show"), duration);
  }
}

function commitReorder(fromIdx, toIdx) {
  if (fromIdx === null || toIdx === null || fromIdx === toIdx) return;
  const customers = courses[activeTab].customers;
  const [movedItem] = customers.splice(fromIdx, 1);
  customers.splice(toIdx, 0, movedItem);

  render();

  clearTimeout(saveTimeout);
  showToast("⏳ Se salvează ordinea...", 0);
  saveTimeout = setTimeout(() => {
    saveOrderToSheet(courses[activeTab].name, customers);
  }, 600);
}

async function saveOrderToSheet(courseName, customers) {
  try {
    const orderedNames = customers.map(c => c.name);
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "reorder",
        courseName: courseName,
        orderedNames: orderedNames
      })
    });

    const result = await response.json();
    if (result.status === "success") {
      showToast("✅ Ordinea a fost salvată în tabel!", 2500);
    } else {
      showToast("⚠️ Eroare la salvare: " + (result.message || ""), 3500);
    }
  } catch (err) {
    showToast("❌ Eroare de rețea la salvare!", 3500);
  }
}

function startDrag(e, index) {
  e.preventDefault();
  e.stopPropagation();

  const cardEl = document.getElementById("store-" + index);
  if (!cardEl) return;

  cardEl.classList.remove("open");
  cardEl.classList.add("dragging");

  dragState = {
    active: true,
    sourceIndex: index,
    currentIndex: index,
    sourceEl: cardEl
  };

  document.addEventListener("touchmove", onDragMove, { passive: false });
  document.addEventListener("touchend", onDragEnd);
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
}

function onDragMove(e) {
  if (!dragState.active) return;
  e.preventDefault();

  const clientY = e.touches ? e.touches[0].clientY : e.clientY;

  const scrollZone = 75;
  const scrollSpeed = 10;
  if (clientY < scrollZone) {
    window.scrollBy(0, -scrollSpeed);
  } else if (clientY > window.innerHeight - scrollZone) {
    window.scrollBy(0, scrollSpeed);
  }

  const cards = Array.from(document.querySelectorAll("#app .store"));
  cards.forEach(c => c.classList.remove("drag-over-top"));

  let targetIdx = dragState.currentIndex;

  for (let i = 0; i < cards.length; i++) {
    const rect = cards[i].getBoundingClientRect();
    if (clientY >= rect.top && clientY <= rect.bottom) {
      const midY = rect.top + rect.height / 2;
      targetIdx = clientY < midY ? i : Math.min(i + 1, cards.length - 1);
      if (i !== dragState.sourceIndex) {
        cards[i].classList.add("drag-over-top");
      }
      break;
    }
  }

  if (targetIdx !== dragState.currentIndex) {
    const container = document.getElementById("app");
    const refCard = cards[targetIdx];
    if (refCard && refCard !== dragState.sourceEl) {
      if (targetIdx > dragState.currentIndex) {
        container.insertBefore(dragState.sourceEl, refCard.nextSibling);
      } else {
        container.insertBefore(dragState.sourceEl, refCard);
      }
      dragState.currentIndex = targetIdx;
    }
  }
}

function onDragEnd() {
  if (!dragState.active) return;

  document.removeEventListener("touchmove", onDragMove);
  document.removeEventListener("touchend", onDragEnd);
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);

  if (dragState.sourceEl) {
    dragState.sourceEl.classList.remove("dragging");
  }
  document.querySelectorAll("#app .store").forEach(c => c.classList.remove("drag-over-top"));

  const finalCards = Array.from(document.querySelectorAll("#app .store"));
  const finalIndex = finalCards.indexOf(dragState.sourceEl);
  const originIndex = dragState.sourceIndex;

  dragState = { active: false, sourceIndex: null, currentIndex: null, sourceEl: null };

  if (finalIndex !== -1 && finalIndex !== originIndex) {
    commitReorder(originIndex, finalIndex);
  }
}

function toggleDrawer() {
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("drawerOverlay");
  const isOpen = drawer.classList.contains("open");
  if (isOpen) { drawer.classList.remove("open"); overlay.classList.remove("open"); } 
  else { drawer.classList.add("open"); overlay.classList.add("open"); }
}

function setTab(index) {
  activeTab = index;
  render();
  toggleDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const appEl = document.getElementById("app");
  const drawerListEl = document.getElementById("drawerList");
  const headerTitleEl = document.getElementById("headerTitle");

  if (!courses.length) {
    headerTitleEl.textContent = "Fără date";
    drawerListEl.innerHTML = "";
    appEl.innerHTML = `<div class="empty">Nu există curse disponibile</div>`;
    return;
  }

  drawerListEl.innerHTML = courses.map((c, i) => {
    const done = c.customers.filter(x => x.status === "Complet").length;
    const isActive = i === activeTab;
    return `
      <div class="driver-item ${isActive ? 'active' : ''}" onclick="setTab(${i})">
        <div class="driver-name">${escape(c.name)}</div>
        <div class="driver-badge">${done}/${c.customers.length}</div>
      </div>`;
  }).join("");

  const currentCourse = courses[activeTab];
  headerTitleEl.textContent = currentCourse ? currentCourse.name : "Selectează o cursă";

  if (!currentCourse || !currentCourse.customers.length) {
    appEl.innerHTML = `<div class="empty">Niciun client în această cursă</div>`;
    return;
  }

  const dragHandleSvg = `
    <svg viewBox="0 0 24 24">
      <circle cx="9" cy="6" r="1.7"></circle>
      <circle cx="15" cy="6" r="1.7"></circle>
      <circle cx="9" cy="12" r="1.7"></circle>
      <circle cx="15" cy="12" r="1.7"></circle>
      <circle cx="9" cy="18" r="1.7"></circle>
      <circle cx="15" cy="18" r="1.7"></circle>
    </svg>`;

  appEl.innerHTML = currentCourse.customers.map((cu, i) => {
    const loadedInCar = cu.status === "Complet";
    const deliveredDone = isDelivered(cu);
    const opKey = normName(currentCourse.name) + "::" + normName(cu.name);
    const isSaving = savingDelivered.has(opKey);

    const loadedBadgeHtml = loadedInCar
      ? `<span class="status-badge done">✅ Încărcat</span>`
      : `<span class="status-badge wait">⏳ În așteptare</span>`;

    const deliveredBadgeHtml = deliveredDone
      ? `<span class="status-badge delivered-tag">🚚 ${escape(cu.deliveredStatus || "Livrat")}</span>`
      : "";

    const deliverBtnHtml = `
      <button type="button"
        class="btn-deliver ${deliveredDone ? 'is-delivered' : ''}"
        ${isSaving ? 'disabled' : ''}
        onclick="toggleDelivered(event, ${i})"
        title="Salvează în coloana AB">
        ${deliveredDone ? '✓ Livrat' : 'Livrat'}
      </button>`;

    const productsHtml = cu.products.length
      ? cu.products.map(p => `
          <div class="product">
            <div class="pname">${escape(p.name)}</div>
            <div class="pval">${escape(p.value)}</div>
          </div>`).join("")
      : `<div style="padding:12px; color:var(--text-muted); text-align:center; font-size:13px;">Niciun produs adăugat</div>`;

    const detaliText = getLocationDetails(cu);
    const photoSrc = getLocationPhoto(cu);
    const hasInfo = !!(detaliText || photoSrc);
    const loc = cu.location || allLocations[normName(cu.name)] || null;

    let locationBtnHtml = "";
    if (loc && (loc.lat || loc.link || loc.address)) {
      locationBtnHtml = `
        <div class="btn-location" onclick="event.stopPropagation(); openMapModal(${i})" title="Deschide harta">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </div>`;
    } else {
      locationBtnHtml = `
        <div class="btn-location disabled" onclick="event.stopPropagation();" title="Locație indisponibilă">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </div>`;
    }

    return `
      <div class="store" id="store-${i}">
        <div class="store-header">
          <div class="drag-handle" 
               ontouchstart="startDrag(event, ${i})" 
               onmousedown="startDrag(event, ${i})" 
               title="Trage pentru a reordona">
            ${dragHandleSvg}
          </div>

          <div class="store-info" onclick="toggleStore(${i})">
            <div class="store-name-row">
              <span class="store-index">${i + 1}</span>
              <div class="store-name">${escape(cu.name)}</div>
              ${hasInfo ? `<button class="customer-info-btn" type="button"
                onclick="event.stopPropagation(); toggleCustomerDetail(${i})"
                aria-label="Detalii client" title="Detalii client">!</button>` : ""}
              ${locationBtnHtml}
            </div>
            <div class="status-row">
              ${loadedBadgeHtml}
              ${deliveredBadgeHtml}
              ${deliverBtnHtml}
            </div>
          </div>

          <div class="icon-arrow" onclick="toggleStore(${i})">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
        ${hasInfo ? `<div class="customer-detail" id="customer-detail-${i}" onclick="event.stopPropagation()">
          <div class="customer-detail-title">📝 Detalii client</div>
          ${detaliText ? `<div class="customer-detail-text">${escape(detaliText)}</div>` : ""}
          ${photoSrc ? `<img class="customer-detail-img" src="${escape(photoSrc)}" alt="Poză livrare" onclick="openPhotoViewer(event, this.src)">` : ""}
        </div>` : ""}
        <div class="store-body">
          <div class="store-body-inner">
            ${productsHtml}
          </div>
        </div>
      </div>`;
  }).join("");
}

function toggleCustomerDetail(i) {
  if (dragState.active) return;
  const el = document.getElementById("store-" + i);
  if (el) el.classList.toggle("details-open");
}

function toggleStore(i) { 
  if (dragState.active) return;
  const el = document.getElementById("store-" + i);
  if (el) el.classList.toggle("open"); 
}

function openMapModal(index) {
  const cu = courses[activeTab]?.customers?.[index];
  const loc = cu?.location || allLocations[normName(cu?.name)] || {};
  let coordinate = "";
  if (loc.lat && loc.lng) {
    coordinate = `${loc.lat},${loc.lng}`;
  } else if (loc.link && String(loc.link).startsWith("http")) {
    coordinate = loc.link;
  } else if (loc.address) {
    coordinate = loc.address;
  }

  const isUrl = String(coordinate).startsWith("http");
  document.getElementById("btnGoogleMaps").href = isUrl ? coordinate : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coordinate)}`;
  document.getElementById("btnAppleMaps").href = isUrl ? coordinate : `https://maps.apple.com/?q=${encodeURIComponent(coordinate)}`;
  
  let wazeUrl = (loc.lat && loc.lng) 
    ? `https://waze.com/ul?ll=${loc.lat},${loc.lng}&navigate=yes`
    : `https://waze.com/ul?q=${encodeURIComponent(coordinate)}`;
  document.getElementById("btnWaze").href = wazeUrl;

  document.getElementById("mapModal").classList.add("open");
}

function closeMapModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById("mapModal").classList.remove("open");
}

function escape(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

loadData();
</script>
