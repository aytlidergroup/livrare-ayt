<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<link rel="icon" type="image/jpeg" href="images.jpg">
<link rel="apple-touch-icon" href="images.jpg">
<title>AYT Livrare</title>
<style>
  :root {
    --bg-base: #0a0f1c;
    --bg-card: rgba(30, 41, 59, 0.6);
    --bg-card-hover: rgba(51, 65, 85, 0.8);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #d4af37;
    --accent-glow: rgba(212, 175, 55, 0.2);
    --success: #10b981;
    --success-bg: rgba(16, 185, 129, 0.15);
    --warning: #f59e0b;
    --warning-bg: rgba(245, 158, 11, 0.15);
    --border-radius: 20px;
    --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; font-family: var(--font-family);
    background-color: var(--bg-base); color: var(--text-main);
    min-height: 100vh; padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(212, 175, 55, 0.08), transparent 25%),
      radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.08), transparent 25%);
    background-attachment: fixed; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- هدر شیشه‌ای --- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; position: sticky; top: 0; z-index: 50;
    background: rgba(10, 15, 28, 0.7);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  
  .icon-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-main); width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    text-decoration: none; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .icon-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.15); }
  .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  .header-center { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; overflow: hidden; }
  .header-logo { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #000; border: 1px solid rgba(212, 175, 55, 0.3); }
  .header-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }

  /* --- منوی کشویی (Drawer) --- */
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; left: -320px; width: 310px; height: 100vh;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    z-index: 100; border-right: 1px solid rgba(255,255,255,0.1);
    transition: left 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    display: flex; flex-direction: column; padding-top: env(safe-area-inset-top);
  }
  .drawer.open { left: 0; }

  .drawer-header { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 12px; }
  .drawer-logo { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #000; border: 2px solid var(--accent); }
  .drawer-title { font-size: 18px; font-weight: 700; color: var(--text-main); flex: 1; }

  .drawer-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }

  .driver-item {
    background: rgba(255,255,255,0.03); border-radius: 14px; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
  }
  .driver-item.active { border-color: rgba(212, 175, 55, 0.3); background: rgba(212, 175, 55, 0.1); }
  .driver-name { font-size: 15px; font-weight: 600; color: var(--text-main); }
  .driver-badge { background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
  .driver-item.active .driver-badge { background: var(--accent); color: #000; }

  /* --- لیست مغازه‌ها --- */
  .container { padding: 16px; max-width: 700px; margin: 0 auto; }
  
  .store { 
    background: var(--bg-card); 
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: var(--border-radius); margin-bottom: 12px; overflow: hidden; 
    border: 1px solid rgba(255,255,255,0.08); 
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: transform 0.2s, border-color 0.2s;
  }
  .store:active { transform: scale(0.98); }
  
  .store-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  
  .store-info { flex: 1; min-width: 0; cursor: pointer; }
  .store-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .store-name { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.2px; }
  
  /* دکمه لوکیشن مدرن */
  .btn-location {
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(212, 175, 55, 0.1); color: var(--accent);
    width: 30px; height: 30px; border-radius: 8px; text-decoration: none;
    border: 1px solid rgba(212, 175, 55, 0.2); transition: all 0.2s;
    flex-shrink: 0;
  }
  .btn-location svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .btn-location:active { background: rgba(212, 175, 55, 0.3); transform: scale(0.95); }
  
  .btn-location.disabled {
    background: rgba(255, 255, 255, 0.03); color: var(--text-muted);
    border-color: rgba(255, 255, 255, 0.05); cursor: not-allowed; opacity: 0.4;
  }

  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
  .status-badge.done { background: var(--success-bg); color: var(--success); }
  .status-badge.wait { background: var(--warning-bg); color: var(--warning); }
  
  .icon-arrow {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer;
  }
  .icon-arrow svg { width: 18px; height: 18px; stroke: var(--text-muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .store.open .icon-arrow { transform: rotate(180deg); background: rgba(255,255,255,0.1); }
  .store.open .icon-arrow svg { stroke: var(--text-main); }

  .store-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s cubic-bezier(0.32, 0.72, 0, 1); background: rgba(0,0,0,0.15); }
  .store.open .store-body { grid-template-rows: 1fr; }
  .store-body-inner { overflow: hidden; padding: 0 20px; opacity: 0; transition: opacity 0.3s ease, padding 0.3s ease; }
  .store.open .store-body-inner { padding: 16px 20px; opacity: 1; }

  .product { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.02); }
  .product:last-child { margin-bottom: 0; }
  .pname { font-size: 14px; color: var(--text-muted); font-weight: 500; flex: 1; padding-right: 12px; word-break: break-word; }
  .pval { font-size: 15px; font-weight: 700; color: var(--accent); background: rgba(212, 175, 55, 0.1); padding: 4px 12px; border-radius: 8px; white-space: nowrap; }

  /* --- حالت‌های خالی و لودینگ --- */
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
  .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 20px; }
  .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 20px; border-radius: var(--border-radius); text-align: center; font-weight: 500; margin: 20px 0; }
</style>
</head>
<body>

<!-- هدر بالا -->
<header class="header">
  <button class="icon-btn" onclick="toggleDrawer()">
    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  
  <div class="header-center">
    <img src="images.jpg" alt="AYT Logo" class="header-logo">
    <div class="header-title" id="headerTitle">Se încarcă...</div>
  </div>
  
  <a href="#" id="headerLocationBtn" target="_blank" class="icon-btn" title="Deschide link">
    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
  </a>
</header>

<!-- منوی کشویی -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <img src="images.jpg" alt="AYT Logo" class="drawer-logo">
    <div class="drawer-title">Selectează Cursa</div>
  </div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<!-- محتوای اصلی -->
<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div style="color: var(--text-muted); font-size: 14px; font-weight: 500;">Se încarcă datele...</div>
  </div>
</div>

<script>
// ⚠️ لینک API خودتون رو اینجا بذارید
const API_URL = "https://script.google.com/macros/s/AKfycbzGvQ8Df4717X6G1lXo9rAJp6EP-oJwg8PlhadcA6tZBDG-R933cPtruoSZEf1cGWDA/exec";

// ⚠️ لینک سایتی که میخواید دکمه بالای صفحه (📍) به اون بره
const HEADER_LOCATION_URL = "https://aytlidergroup.github.io/Ayt-Locatie/";

// تنظیم لینک دکمه هدر
document.getElementById("headerLocationBtn").href = HEADER_LOCATION_URL;

let courses = [];
let activeTab = 0;

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    courses = data.courses || [];
    render();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="error">Eroare de conexiune.<br>Vă rugăm verificați internetul.</div>`;
  }
}

function toggleDrawer() {
  const drawer = document.getElementById("drawer");
  const overlay = document.getElementById("drawerOverlay");
  const isOpen = drawer.classList.contains("open");
  if (isOpen) { drawer.classList.remove("open"); overlay.classList.remove("open"); } 
  else { drawer.classList.add("open"); overlay.classList.add("open"); }
}

function setTab(index) {
  activeTab = index;
  render();
  toggleDrawer();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  const appEl = document.getElementById("app");
  const drawerListEl = document.getElementById("drawerList");
  const headerTitleEl = document.getElementById("headerTitle");

  if (!courses.length) {
    headerTitleEl.textContent = "Fără date";
    drawerListEl.innerHTML = "";
    appEl.innerHTML = `<div class="empty">Nu există curse disponibile</div>`;
    return;
  }

  drawerListEl.innerHTML = courses.map((c, i) => {
    const done = c.customers.filter(x => x.status === "Complet").length;
    const isActive = i === activeTab;
    return `
      <div class="driver-item ${isActive ? 'active' : ''}" onclick="setTab(${i})">
        <div class="driver-name">${escape(c.name)}</div>
        <div class="driver-badge">${done}/${c.customers.length}</div>
      </div>`;
  }).join("");

  const currentCourse = courses[activeTab];
  headerTitleEl.textContent = currentCourse ? currentCourse.name : "Selectează o cursă";

  if (!currentCourse || !currentCourse.customers.length) {
    appEl.innerHTML = `<div class="empty">Niciun client în această cursă</div>`;
    return;
  }

  appEl.innerHTML = currentCourse.customers.map((cu, i) => {
    const done = cu.status === "Complet";
    const statusHtml = done 
      ? `<span class="status-badge done">✅ Livrat</span>` 
      : `<span class="status-badge wait">⏳ În așteptare</span>`;
      
    const productsHtml = cu.products.length
      ? cu.products.map(p => `
          <div class="product">
            <div class="pname">${escape(p.name)}</div>
            <div class="pval">${escape(p.value)}</div>
          </div>`).join("")
      : `<div style="padding:12px; color:var(--text-muted); text-align:center; font-size:13px;">Niciun produs adăugat</div>`;

    // منطق دکمه لوکیشن
    let locationBtnHtml = "";
    if (cu.location) {
      locationBtnHtml = `
        <div class="btn-location" onclick="event.stopPropagation(); openNativeNavigation('${escape(cu.location)}')" title="Deschide harta">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </div>`;
    } else {
      locationBtnHtml = `
        <div class="btn-location disabled" onclick="event.stopPropagation();" title="Locație indisponibilă">
          <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        </div>`;
    }

    return `
      <div class="store" id="store-${i}">
        <div class="store-header">
          <div class="store-info" onclick="toggleStore(${i})">
            <div class="store-name-row">
              <div class="store-name">${escape(cu.name)}</div>
              ${locationBtnHtml}
            </div>
            ${statusHtml}
          </div>
          <div class="icon-arrow" onclick="toggleStore(${i})">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
        <div class="store-body">
          <div class="store-body-inner">
            ${productsHtml}
          </div>
        </div>
      </div>`;
  }).join("");
}

function toggleStore(i) { 
  const el = document.getElementById("store-" + i);
  el.classList.toggle("open"); 
}

// --- باز کردن اپ ناوبری خود گوشی ---
function openNativeNavigation(locationStr) {
  const isUrl = locationStr.startsWith("http");
  let targetUrl = "";
  
  // تشخیص سیستم‌عامل
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(navigator.userAgent);

  if (isUrl) {
    // اگر توی شیت یه لینک کامل گوگل مپ گذاشتید، همون رو باز میکنه
    targetUrl = locationStr;
  } else {
    // اگر آدرس متنی یا مختصات بود
    // مختصات رو تبدیل میکنیم به فرمت استاندارد
    let encodedLoc = "";
    
    if (locationStr.includes(",") && !isNaN(locationStr.split(",")[0])) {
      // فرمت: 44.4,26.1
      encodedLoc = locationStr;
    } else {
      // فرمت: آدرس متنی
      encodedLoc = encodeURIComponent(locationStr);
    }

    if (isIOS) {
      // در آیفون: استفاده از maps:// باعث میشه منوی انتخاب اپ باز بشه
      targetUrl = `maps://?q=${encodedLoc}`;
    } else if (isAndroid) {
      // در اندروید: استفاده از geo: باعث میشه منوی انتخاب اپ باز بشه
      targetUrl = `geo:0,0?q=${encodedLoc}`;
    } else {
      // در دسکتاپ
      targetUrl = `https://www.google.com/maps/search/?api=1&query=${encodedLoc}`;
    }
  }

  // باز کردن لینک در تب جدید
  window.open(targetUrl, '_blank');
}

function escape(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

loadData();
</script>
</body>
</html>
